name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  MISE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  lint:
    name: Lint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4
        with:
          experimental: true

      - name: Check formatting (Swift + Markdown)
        run: mise run format-check

      - name: Lint (SwiftLint)
        run: mise run lint

  build:
    name: Build & Test
    runs-on: macos-15
    needs: lint

    steps:
      - uses: actions/checkout@v7

      - name: Cache SPM dependencies
        uses: actions/cache@v5
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - uses: jdx/mise-action@v4
        with:
          experimental: true

      - name: Show Swift version
        run: swift --version

      - name: Build
        run: |
          set -o pipefail
          swift build 2>&1 | xcsift

      - name: Test
        run: |
          set -o pipefail
          swift test --skip Performance --verbose 2>&1 | tee test-output.log | xcsift

      # xcsift summarizes XCTest results only, so a swift-testing failure shows
      # up as a non-zero exit with an otherwise successful-looking summary.
      - name: Show test failures
        if: failure()
        run: |
          grep -E '✘|recorded an issue|Fatal error|Test run with' test-output.log | head -60 || true
